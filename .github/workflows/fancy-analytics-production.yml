name: Fancy Analytics Production Wiring Validation

on:
  pull_request:
    paths:
      - 'src/services/FancyAnalyticsObservation.js'
      - 'src/services/FancyAnalyticsPersistence.js'
      - 'src/services/FancyAnalyticsProduction.js'
      - 'scripts/validate-fancy-analytics-production.js'
      - '.github/workflows/fancy-analytics-production.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check src/services/FancyAnalyticsProduction.js
          node --check scripts/validate-fancy-analytics-production.js
      - name: Validate production boundary
        run: node scripts/validate-fancy-analytics-production.js
