name: Fancy Analytics Summary Endpoint Validation
on:
  pull_request:
    paths:
      - 'src/services/FancyAnalyticsSummaryEndpoint.js'
      - 'scripts/validate-fancy-analytics-summary-endpoint.js'
      - '.github/workflows/fancy-analytics-summary-endpoint.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/services/FancyAnalyticsSummaryEndpoint.js
      - run: node scripts/validate-fancy-analytics-summary-endpoint.js
