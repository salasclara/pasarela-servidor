name: Fancy Analytics Reader Validation
on:
  pull_request:
    paths:
      - 'src/services/FancyAnalyticsReader.js'
      - 'scripts/validate-fancy-analytics-reader.js'
      - '.github/workflows/fancy-analytics-reader.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/services/FancyAnalyticsReader.js
      - run: node scripts/validate-fancy-analytics-reader.js
