name: Validate Fancy Editorial Alignment

on:
  pull_request:
    paths:
      - 'src/services/FancyEditorialAlignment.js'
      - 'src/services/FancyAlignmentObserver.js'
      - 'scripts/validate-fancy-editorial-alignment.js'
      - 'scripts/validate-fancy-alignment-observer.js'
      - '.github/workflows/validate-fancy-editorial-alignment.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate semantic alignment
        run: node scripts/validate-fancy-editorial-alignment.js
      - name: Validate observation mode
        run: node scripts/validate-fancy-alignment-observer.js
