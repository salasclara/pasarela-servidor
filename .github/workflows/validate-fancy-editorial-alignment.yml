name: Validate Fancy Editorial Alignment

on:
  pull_request:
    paths:
      - 'server.js'
      - 'src/services/FancyEditorialAlignment.js'
      - 'scripts/validate-fancy-editorial-alignment.js'
      - 'src/services/FancyInstagramPublisher.js'
      - 'scripts/validate-fancy-instagram-publisher.js'
      - 'src/services/FancyInstagramTestEndpoint.js'
      - 'scripts/validate-fancy-instagram-test-endpoint.js'
      - '.github/workflows/validate-fancy-editorial-alignment.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate server syntax
        run: node --check server.js
      - name: Validate semantic alignment
        run: node scripts/validate-fancy-editorial-alignment.js
      - name: Validate Instagram publisher
        run: node scripts/validate-fancy-instagram-publisher.js
      - name: Validate Instagram controlled endpoint
        run: node scripts/validate-fancy-instagram-test-endpoint.js
